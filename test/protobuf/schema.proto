syntax = "proto3";

package mygame.sample;

// An enum for the colors
enum Color
{
  RED = 0;
  GREEN = 1;
  BLUE = 2;
}

// A 3D position
message Vec3
{
  float x = 1;
  float y = 2;
  float z = 3;
}

// A monster
message Monster
{
  Vec3 pos = 1;
  int32 mana = 2;
  int32 hp = 3;
  string name = 4;
  bytes inventory = 5;
  Color color = 6;
}
