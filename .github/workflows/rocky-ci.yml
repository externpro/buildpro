name: rocky-ci

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-ci.dockerfile'
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-ci.dockerfile'
  workflow_dispatch:
  workflow_run:
    workflows: ["rocky-mdv"]
    types:
      - completed

jobs:
  rocky-ci:
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: externpro/buildpro/.github/workflows/buildpro.yml@dev
    with:
      img: rocky-ci
