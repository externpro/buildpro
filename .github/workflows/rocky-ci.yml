name: rocky-ci
on:
  push:
    branches: ["xpro"]
    paths:
      - 'public/rocky-ci.dockerfile'
  pull_request:
    branches: ["xpro"]
    paths:
      - 'public/rocky-ci.dockerfile'
  workflow_dispatch:
  workflow_run:
    workflows: ["rocky-mdv"]
    types:
      - completed
jobs:
  rocky-ci:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'workflow_dispatch')
    uses: ./.github/workflows/buildpro.yml
    with:
      img: rocky-ci
