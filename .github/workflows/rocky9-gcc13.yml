name: rocky9-gcc13
on:
  push:
    branches: ["xpro"]
    paths:
      - 'public/rocky9-gcc13.dockerfile'
  pull_request:
    branches: ["xpro"]
    paths:
      - 'public/rocky9-gcc13.dockerfile'
  workflow_dispatch:
jobs:
  rocky9-gcc13:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/buildpro.yml
    with:
      img: rocky9-gcc13
      platforms: "linux/amd64,linux/arm64"
