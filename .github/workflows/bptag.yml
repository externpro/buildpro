name: buildpro tag + release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create on HEAD of dev (e.g. 26.01)'
        required: true
        type: string
jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKFLOWS_LAUNCH: |
        rocky8-gcc9
        rocky9-gcc13
        rocky10-gcc15
        ubuntu
      WORKFLOWS_DOWNSTREAM: |
        rocky-mdv
        rocky-ci
        rocky-pdv
        rocky-pin
      INITIAL_WAIT_SECONDS: "600"
      POLL_INTERVAL_SECONDS: "30"
      POLL_INTERVAL_MAX_SECONDS: "300"
    steps:
      -
        name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true
      -
        name: Create and push annotated tag
        id: create_tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sha=$(git rev-parse HEAD)
          echo "Tagging dev HEAD: ${sha} with tag ${TAG}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to overwrite." >&2
            exit 1
          fi
          git tag -a "${TAG}" -m "${TAG} tag" "${sha}"
          git push origin "refs/tags/${TAG}"
          echo "tag_created=true" >> "$GITHUB_OUTPUT"
      -
        name: Dispatch base image builds on tag
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t workflows_launch < <(printf '%s\n' "${WORKFLOWS_LAUNCH}" | sed '/^\s*$/d')
          for wf in "${workflows_launch[@]}"; do
            wf_file="${wf}.yml"
            echo "Dispatching ${wf_file} at ref ${TAG}"
            gh api -X POST "repos/${REPO}/actions/workflows/${wf_file}/dispatches" \
              -f ref="${TAG}"
          done
      -
        name: Wait for GHCR tags for all images
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Waiting for GHCR package tags for ${TAG}"
          #####
          initial_wait="${INITIAL_WAIT_SECONDS}"
          poll_interval="${POLL_INTERVAL_SECONDS}"
          poll_interval_max="${POLL_INTERVAL_MAX_SECONDS}"
          if [ -n "${initial_wait}" ] && [ "${initial_wait}" -gt 0 ] 2>/dev/null; then
            echo "Initial wait: ${initial_wait}s before first status check"
            sleep "${initial_wait}"
          fi
          mapfile -t workflows_launch < <(printf '%s\n' "${WORKFLOWS_LAUNCH}" | sed '/^\s*$/d')
          mapfile -t workflows_downstream < <(printf '%s\n' "${WORKFLOWS_DOWNSTREAM}" | sed '/^\s*$/d')
          required_images=("${workflows_launch[@]}" "${workflows_downstream[@]}")
          deadline=$(( $(date +%s) + 7200 ))
          while :; do
            now=$(date +%s)
            if [ "${now}" -ge "${deadline}" ]; then
              echo "Timed out waiting for GHCR tags for ${TAG}" >&2
              exit 1
            fi
            all_ok=true
            pending_count=0
            for img in "${required_images[@]}"; do
              pkg_name="buildpro%2F${img}"
              api_err_file="$(mktemp)"
              version_id=""
              if out=$(GH_TOKEN="${GITHUB_TOKEN}" gh api \
                -H "Accept: application/vnd.github+json" \
                --paginate \
                "orgs/${OWNER}/packages/container/${pkg_name}/versions" \
                --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" 2>"${api_err_file}"); then
                version_id=$(printf '%s\n' "${out}" | head -n1 || true)
              else
                api_err=$(cat "${api_err_file}" || true)
                if [ -n "${api_err}" ]; then
                  echo "Warning: failed to query package versions for ${img}: ${api_err}" >&2
                fi
              fi
              rm -f "${api_err_file}"
              if [ -z "${version_id}" ]; then
                echo "${img}: pending"
                all_ok=false
                pending_count=$((pending_count + 1))
              else
                echo "${img}: tagged"
              fi
            done
            if [ "${all_ok}" = "true" ]; then
              echo "All required images are tagged ${TAG} in GHCR"
              break
            fi
            if [ "${pending_count}" -gt 0 ]; then
              next_sleep="${poll_interval}"
              if [ "${pending_count}" -ge 4 ]; then
                next_sleep=120
              elif [ "${pending_count}" -ge 2 ]; then
                next_sleep=60
              fi
              if [ "${next_sleep}" -gt "${poll_interval_max}" ]; then
                next_sleep="${poll_interval_max}"
              fi
              echo "Pending workflows: ${pending_count}. Next check in ${next_sleep}s"
              sleep "${next_sleep}"
            else
              sleep "${poll_interval}"
            fi
          done
      -
        name: Dispatch bprelease on tag
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          wf="bprelease.yml"
          echo "Dispatching ${wf} at ref ${TAG}"
          gh api -X POST "repos/${REPO}/actions/workflows/${wf}/dispatches" \
            -f ref="${TAG}"
      -
        name: Cleanup tag on failure
        if: ${{ always() && steps.create_tag.outputs.tag_created == 'true' && (failure() || cancelled()) }}
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          echo "Deleting remote tag ${TAG} due to failure/cancelled run"
          git push origin --delete "${TAG}"
