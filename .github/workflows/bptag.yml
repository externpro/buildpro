name: buildpro tag + release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create on HEAD of dev (e.g. 25.06.3)'
        required: true
        type: string
jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.BPWORKFLOW_TOKEN != '' && secrets.BPWORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
      WORKFLOWS_LAUNCH: |
        rocky8-gcc9
        rocky9-gcc13
        rocky10-gcc15
        ubuntu
      WORKFLOWS_DOWNSTREAM: |
        rocky-mdv
        rocky-ci
        rocky-pdv
        rocky-pin
      INITIAL_WAIT_SECONDS: "600"
      POLL_INTERVAL_SECONDS: "30"
      POLL_INTERVAL_MAX_SECONDS: "300"
    steps:
      -
        name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true
      -
        name: Create and push annotated tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sha=$(git rev-parse HEAD)
          echo "Tagging dev HEAD: ${sha} with tag ${TAG}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to overwrite." >&2
            exit 1
          fi
          git tag -a "${TAG}" -m "${TAG} tag" "${sha}"
          git push origin "refs/tags/${TAG}"
      -
        name: Dispatch base image builds on tag
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t workflows_launch < <(printf '%s\n' "${WORKFLOWS_LAUNCH}" | sed '/^\s*$/d')
          for wf in "${workflows_launch[@]}"; do
            wf_file="${wf}.yml"
            echo "Dispatching ${wf_file} at ref ${TAG}"
            gh api -X POST "repos/${REPO}/actions/workflows/${wf_file}/dispatches" \
              -f ref="${TAG}"
          done
      -
        name: Wait for base + downstream workflows
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-list -n 1 "${TAG}")
          echo "Waiting for workflows at tag ${TAG} (sha ${sha})"
          #####
          api_err_file="$(mktemp)"
          if ! gh api -H "Accept: application/vnd.github+json" "repos/${REPO}/actions/runs" -f per_page=1 2>"${api_err_file}" >/dev/null; then
            api_err=$(cat "${api_err_file}" || true)
            rm -f "${api_err_file}"
            echo "Error: cannot query Actions runs via GitHub API (${api_err})." >&2
            echo "This workflow needs a PAT stored as the Actions secret BPWORKFLOW_TOKEN with repo + workflow scopes." >&2
            exit 1
          fi
          rm -f "${api_err_file}"
          #####
          initial_wait="${INITIAL_WAIT_SECONDS}"
          poll_interval="${POLL_INTERVAL_SECONDS}"
          poll_interval_max="${POLL_INTERVAL_MAX_SECONDS}"
          if [ -n "${initial_wait}" ] && [ "${initial_wait}" -gt 0 ] 2>/dev/null; then
            echo "Initial wait: ${initial_wait}s before first status check"
            sleep "${initial_wait}"
          fi
          mapfile -t workflows_launch < <(printf '%s\n' "${WORKFLOWS_LAUNCH}" | sed '/^\s*$/d')
          mapfile -t workflows_downstream < <(printf '%s\n' "${WORKFLOWS_DOWNSTREAM}" | sed '/^\s*$/d')
          required_names=("${workflows_launch[@]}" "${workflows_downstream[@]}")
          deadline=$(( $(date +%s) + 7200 ))
          while :; do
            now=$(date +%s)
            if [ "${now}" -ge "${deadline}" ]; then
              echo "Timed out waiting for workflows for tag ${TAG}" >&2
              exit 1
            fi
            all_ok=true
            pending_count=0
            api_failures=0
            for name in "${required_names[@]}"; do
              api_err_file="$(mktemp)"
              conclusions=""
              if out=$(gh api \
                -H "Accept: application/vnd.github+json" \
                --paginate \
                "repos/${REPO}/actions/runs" \
                -f per_page=100 \
                --jq ".workflow_runs[] | select(.name == \"${name}\" and .head_sha == \"${sha}\") | .conclusion" \
                2>"${api_err_file}"); then
                conclusions=$(printf '%s\n' "${out}" | head -n1 || true)
              else
                api_err=$(cat "${api_err_file}" || true)
                api_failures=$((api_failures + 1))
                all_ok=false
                rm -f "${api_err_file}"
                continue
              fi
              rm -f "${api_err_file}"
              if [ -z "${conclusions}" ] || [ "${conclusions}" = "null" ]; then
                echo "${name}: pending"
                all_ok=false
                pending_count=$((pending_count + 1))
                continue
              fi
              if [ "${conclusions}" != "success" ]; then
                echo "${name}: ${conclusions} (failing)" >&2
                exit 1
              fi
              echo "${name}: success"
            done
            if [ "${all_ok}" = "true" ]; then
              echo "All required workflows succeeded for tag ${TAG}"
              break
            fi
            if [ "${api_failures}" -gt 3 ]; then
              echo "Failed to query Actions runs for 4 or more workflows; exiting." >&2
              exit 1
            fi
            if [ "${api_failures}" -gt 0 ]; then
              echo "Warning: failed to query Actions runs (${api_failures} workflows) during this poll iteration; will retry." >&2
            fi
            if [ "${pending_count}" -gt 0 ]; then
              next_sleep="${poll_interval}"
              if [ "${pending_count}" -ge 4 ]; then
                next_sleep=120
              elif [ "${pending_count}" -ge 2 ]; then
                next_sleep=60
              fi
              if [ "${next_sleep}" -gt "${poll_interval_max}" ]; then
                next_sleep="${poll_interval_max}"
              fi
              echo "Pending workflows: ${pending_count}. Next check in ${next_sleep}s"
              sleep "${next_sleep}"
            else
              sleep "${poll_interval}"
            fi
          done
      -
        name: Dispatch bprelease on tag
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          wf="bprelease.yml"
          echo "Dispatching ${wf} at ref ${TAG}"
          gh api -X POST "repos/${REPO}/actions/workflows/${wf}/dispatches" \
            -f ref="${TAG}"
