name: rocky8-gcc9
on:
  push:
    branches: ["xpro"]
    paths:
      - 'public/rocky8-gcc9.dockerfile'
  pull_request:
    branches: ["xpro"]
    paths:
      - 'public/rocky8-gcc9.dockerfile'
  workflow_dispatch:
jobs:
  rocky8-gcc9:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
      artifact-metadata: write
    uses: ./.github/workflows/buildpro.yml
    with:
      img: rocky8-gcc9
      platforms: "linux/amd64,linux/arm64"
  dispatch-downstream:
    needs: rocky8-gcc9
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      actions: write
      contents: read
    steps:
      -
        name: Dispatch dependent workflows for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for wf in rocky-mdv.yml rocky-pin.yml rocky-pdv.yml; do
            echo "Dispatching ${wf} at ref ${REF}"
            gh api -X POST "repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -f ref="${REF}"
          done
