name: rocky8-gcc9
on:
  push:
    branches: [ "dev" ]
    paths:
      - 'public/rocky8-gcc9.dockerfile'
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'public/rocky8-gcc9.dockerfile'
  workflow_dispatch:
jobs:
  rocky8-gcc9:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/buildpro.yml
    with:
      img: rocky8-gcc9
      platforms: "linux/amd64,linux/arm64"
