name: buildpro release
on:
  workflow_dispatch:
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      IMAGES: |
        rocky10-gcc15
        rocky9-gcc13
        rocky8-gcc9
        rocky-mdv
        rocky-ci
        rocky-pin
        rocky-pdv
        ubuntu
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      -
        name: Create draft release with image links
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "This workflow must be run from a git tag. Use the 'Run workflow' ref picker to select a tag." >&2
            echo "Current ref: ${GITHUB_REF:-} (type: ${GITHUB_REF_TYPE:-unknown})" >&2
            exit 1
          fi
          mapfile -t images < <(printf '%s\n' "${IMAGES}" | sed '/^\s*$/d')
          #####
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY}"
          tag="${TAG}"
          #####
          notes_file="$(mktemp)"
          {
            echo "| docker image | buildpro packages | workflow run |"
            echo "| ------------ | ----------------- | ------------ |"
          } > "${notes_file}"
          for img in "${images[@]}"; do
            echo "Processing image: ${img}"
            #####
            dockerfile_url="https://github.com/${repo}/blob/${tag}/public/${img}.dockerfile"
            dockerfile_cell="[${img}](${dockerfile_url})"
            pkg_name="buildpro%2F${img}"
            base_pkg_url="https://github.com/${owner}/buildpro/pkgs/container/${pkg_name}/versions"
            version_url="${base_pkg_url}"
            image_ref_text="ghcr.io/${repo}/${img}:${tag}"
            image_cell="[ghcr.io/${repo}/${img} versions](${base_pkg_url}) (tag not found yet)"
            #####
            # Try to find a specific package version that has this tag
            # API: GET /orgs/{org}/packages/container/{package_name}/versions
            version_id=""
            any_success="false"
            sleep_s=5
            deadline=$(( $(date +%s) + 300 ))
            while :; do
              now=$(date +%s)
              if [ "${now}" -ge "${deadline}" ]; then
                break
              fi
              ids=""
              api_err_file="$(mktemp)"
              if out=$(GH_TOKEN="${GITHUB_TOKEN}" gh api \
                -H "Accept: application/vnd.github+json" \
                --paginate \
                "orgs/${owner}/packages/container/${pkg_name}/versions" \
                --jq ".[] | select(.metadata.container.tags[]? == \"${tag}\") | .id" 2>"${api_err_file}"); then
                any_success="true"
                ids="${out}"
              else
                api_err=$(cat "${api_err_file}" || true)
                if [ -n "${api_err}" ]; then
                  echo "Warning: failed to query org package versions for ${img}: ${api_err}" >&2
                fi
                if out2=$(GH_TOKEN="${GITHUB_TOKEN}" gh api \
                  -H "Accept: application/vnd.github+json" \
                  --paginate \
                  "users/${owner}/packages/container/${pkg_name}/versions" \
                  --jq ".[] | select(.metadata.container.tags[]? == \"${tag}\") | .id" 2>>"${api_err_file}"); then
                  any_success="true"
                  ids="${out2}"
                else
                  api_err2=$(tail -n 20 "${api_err_file}" || true)
                  if [ -n "${api_err2}" ]; then
                    echo "Warning: failed to query user package versions for ${img}: ${api_err2}" >&2
                  fi
                fi
              fi
              rm -f "${api_err_file}"
              version_id=$(printf '%s\n' "${ids}" | head -n1 || true)
              if [ -n "${version_id}" ]; then
                break
              fi
              sleep "${sleep_s}"
              if [ "${sleep_s}" -lt 60 ]; then
                sleep_s=$((sleep_s * 2))
                if [ "${sleep_s}" -gt 60 ]; then
                  sleep_s=60
                fi
              fi
            done
            if [ -n "${version_id}" ]; then
              version_url="https://github.com/${owner}/buildpro/pkgs/container/${pkg_name}/${version_id}?tag=${tag}"
              image_cell="[${image_ref_text}](${version_url})"
            else
              if [ "${any_success}" != "true" ]; then
                image_cell="[ghcr.io/${repo}/${img} versions](${base_pkg_url}) (package query failed)"
              fi
            fi
            #####
            runs_query="workflow%3A${img}+branch%3A${tag}"
            filtered_runs_url="https://github.com/${repo}/actions?query=${runs_query}"
            run_cell="[${tag} runs](${filtered_runs_url})"
            #####
            # Append table row
            echo "| ${dockerfile_cell} | ${image_cell} | ${run_cell} |" >> "${notes_file}"
          done
          {
            echo
            echo "- The \`workflow run\` link goes to a filtered Actions view for the workflow and tag."
            echo "- Following the \`workflow run\` link will lead you to the run page, which includes:"
            echo "  - links to the attestation and software bill of materials"
            echo "  - the SBOM is in SPDX (Software Package Data Exchange) format (.spdx.json)"
          } >> "${notes_file}"
          #####
          # Refuse to create a release if one already exists for this tag.
          release_tag="${tag}"
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "Release for tag ${release_tag} already exists; refusing to create another release for the same git tag." >&2
            exit 1
          fi
          echo "Creating draft release with tag: ${release_tag} (for build tag ${tag})"
          gh release create "${release_tag}" \
            --title "${release_tag}" \
            --draft \
            --notes-file "${notes_file}"
          rm -f "${notes_file}"
