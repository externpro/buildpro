name: buildpro release
on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated list of buildpro images (in desired order)'
        required: false
        default: 'rocky10-gcc15,rocky9-gcc13,rocky8-gcc9,rocky-mdv,rocky-ci,rocky-pin,rocky-pdv,ubuntu'
        type: string
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      -
        name: Create draft release with image links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGES: ${{ github.event.inputs.images }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "This workflow must be run from a git tag. Use the 'Run workflow' ref picker to select a tag." >&2
            echo "Current ref: ${GITHUB_REF:-} (type: ${GITHUB_REF_TYPE:-unknown})" >&2
            exit 1
          fi
          images_csv="${IMAGES:-}"
          if [ -z "${images_csv}" ]; then
            images_csv="rocky-pro,rocky-mdv,rocky-ci,rocky-pin,rocky-pdv,ubuntu"
          fi
          IFS=',' read -r -a images <<< "${images_csv}"
          #####
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY}"
          tag="${TAG}"
          #####
          # Resolve the commit SHA for this tag, if it exists
          tag_sha=""
          if tag_sha_candidate=$(git rev-list -n 1 "${tag}" 2>/dev/null || true); then
            tag_sha="${tag_sha_candidate}"
          fi
          #####
          notes_file="$(mktemp)"
          {
            echo "| docker image | buildpro packages | workflow run |"
            echo "| ------------ | ----------------- | ------------ |"
          } > "${notes_file}"
          for img in "${images[@]}"; do
            echo "Processing image: ${img}"
            #####
            dockerfile_url="https://github.com/${repo}/blob/${tag}/public/${img}.dockerfile"
            dockerfile_cell="[${img}](${dockerfile_url})"
            pkg_name="buildpro%2F${img}"
            base_pkg_url="https://github.com/${owner}/buildpro/pkgs/container/${pkg_name}/versions"
            version_url="${base_pkg_url}"
            image_ref_text="ghcr.io/${repo}/${img}:${tag}"
            image_cell="[ghcr.io/${repo}/${img} versions](${base_pkg_url}) (tag DNE?)"
            #####
            # Try to find a specific package version that has this tag
            # API: GET /orgs/{org}/packages/container/{package_name}/versions
            version_id=""
            if ids=$(gh api \
              -H "Accept: application/vnd.github+json" \
              --paginate \
              "orgs/${owner}/packages/container/${pkg_name}/versions" \
              --jq ".[] | select(.metadata.container.tags[]? == \"${tag}\") | .id" 2>/dev/null); then
              version_id=$(echo "${ids}" | head -n1 || true)
            fi
            if [ -n "${version_id}" ]; then
              version_url="https://github.com/${owner}/buildpro/pkgs/container/${pkg_name}/${version_id}?tag=${tag}"
              image_cell="[${image_ref_text}](${version_url})"
            fi
            #####
            # Determine a specific successful workflow run for this image/tag, if possible
            workflow_url="https://github.com/${repo}/actions/workflows/${img}.yml"
            run_cell="no matching run (see [workflow](${workflow_url}))"
            if [ -n "${tag_sha}" ]; then
              run_id=""
              api_err_file="$(mktemp)"
              if ids=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${repo}/actions/workflows/${img}.yml/runs" \
                -f per_page=100 \
                --jq ".workflow_runs[] | select(.head_sha == \"${tag_sha}\" and .conclusion == \"success\") | .id" 2>"${api_err_file}"); then
                run_id=$(echo "${ids}" | head -n1 || true)
              else
                api_err=$(cat "${api_err_file}" || true)
                run_cell="could not query runs (see [workflow](${workflow_url}))"
                if [ -n "${api_err}" ]; then
                  echo "Warning: failed to query workflow runs for ${img}.yml: ${api_err}" >&2
                fi
              fi
              rm -f "${api_err_file}"
              if [ -n "${run_id}" ]; then
                specific_run_url="https://github.com/${repo}/actions/runs/${run_id}"
                run_cell="[${tag} run](${specific_run_url})"
              fi
            else
              run_cell="tag ${tag} not found in git ([workflow](${workflow_url}))"
            fi
            #####
            # Append table row
            echo "| ${dockerfile_cell} | ${image_cell} | ${run_cell} |" >> "${notes_file}"
          done
          {
            echo
            echo "- The \`workflow run\` link includes:"
            echo "  - links to the attestation and software bill of materials"
            echo "  - the SBOM is in SPDX (Software Package Data Exchange) format (.spdx.json)"
          } >> "${notes_file}"
          #####
          # Refuse to create a release if one already exists for this tag.
          release_tag="${tag}"
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "Release for tag ${release_tag} already exists; refusing to create another release for the same git tag." >&2
            exit 1
          fi
          echo "Creating draft release with tag: ${release_tag} (for build tag ${tag})"
          gh release create "${release_tag}" \
            --title "${release_tag}" \
            --draft \
            --notes-file "${notes_file}"
          rm -f "${notes_file}"
