    branches: [ "dev" ]
    paths:
      - 'public/rocky-pro.dockerfile'
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-pro.dockerfile'
  workflow_dispatch:
jobs:
  rocky-pro:
    uses: externpro/buildpro/.github/workflows/buildpro.yml@dev
    with:
      img: rocky-pro
      platforms: "linux/amd64,linux/arm64"
