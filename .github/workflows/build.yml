name: Build
on:
  workflow_dispatch:
jobs:
  linux:
    uses: externpro/externpro/.github/workflows/build-linux.yml@ghact
    with:
      cmake-workflow-preset: LinuxReleaseNoInstall
      runon: ubuntu-latest
    secrets: inherit
  linux-arm64:
    uses: externpro/externpro/.github/workflows/build-linux.yml@ghact
    with:
      cmake-workflow-preset: LinuxReleaseNoInstall
      runon: ubuntu-24.04-arm
    secrets: inherit
  windows:
    uses: externpro/externpro/.github/workflows/build-windows.yml@ghact
    with:
      cmake-workflow-preset: WindowsReleaseNoInstall
    secrets: inherit
