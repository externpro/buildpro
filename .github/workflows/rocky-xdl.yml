name: rocky-xdl
on:
  push:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-xdl.dockerfile'
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-xdl.dockerfile'
  workflow_dispatch:
  workflow_run:
    workflows: ["rocky-pro"]
    types:
      - completed
jobs:
  rocky-xdl:
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/buildpro.yml
    with:
      img: rocky-xdl
      platforms: "linux/amd64,linux/arm64"
