name: rocky-pdv

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-pdv.dockerfile'
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-pdv.dockerfile'
  workflow_dispatch:
  workflow_run:
    workflows: ["rocky-pro"]
    types:
      - completed

jobs:
  rocky-pdv:
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: externpro/externpro/.github/workflows/buildpro.yml@main
    with:
      img: rocky-pdv
