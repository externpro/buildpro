name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # fetches all history
        fetch-tags: true # explicitly fetches tags
        submodules: true

    - name: Build the Docker image
      run: ./public/ghimg.sh
