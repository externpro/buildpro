name: Build docker buildpro image
on:
  workflow_call:
    inputs:
      img:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: "local" # use platform that invokes the build
jobs:
  buildpro:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    env:
      REGISTRY: ghcr.io
    steps:
      -
        name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fetches all history
          fetch-tags: true # explicitly fetches tags
          submodules: true
      -
        name: Determine tags
        id: tags
        run: |
          gtag=""
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_run" ] && [ -f "${GITHUB_EVENT_PATH:-}" ]; then
            sha=$(jq -r '.workflow_run.head_sha // empty' "${GITHUB_EVENT_PATH}")
            if [ -n "${sha}" ]; then
              gtag=$(git tag --points-at "${sha}" | head -n1 || true)
            fi
          fi
          if [ -z "${gtag}" ]; then
            gtag=$(git describe --tags)
            if [ -n "$(git status --porcelain --untracked=no)" ] || [[ ${gtag} == *"-g"* ]]; then
              gtag=latest
            fi
          fi
          echo "tag=$gtag" >> $GITHUB_OUTPUT
          echo "latest=${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.img }}:latest" >> $GITHUB_OUTPUT
          echo "tagged=${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.img }}:$gtag" >> $GITHUB_OUTPUT
        working-directory: ${{ github.workspace }}
      -
        name: Report before build
        run: |
          echo "img: ${{ inputs.img }}"
          echo "latest: ${{ steps.tags.outputs.latest }}"
          echo "tagged: ${{ steps.tags.outputs.tagged }}"
          # Only run docker commands if the latest tag exists
          if docker manifest inspect ${{ steps.tags.outputs.latest }} >/dev/null 2>&1; then
            docker pull ${{ steps.tags.outputs.latest }}
            docker images
            docker rmi ${{ steps.tags.outputs.latest }}
          else
            echo "latest tag does not exist, skipping docker commands"
          fi
      -
        name: Set up Docker Buildx (for multi-platform builds)
        uses: docker/setup-buildx-action@v3
      -
        name: Set up QEMU (for emulating different CPU architectures)
        uses: docker/setup-qemu-action@v3
      -
        name: Authenticate GitHub Container Registry (ghcr)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Extract metadata (tags, labels) for Docker
        id: metadata
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.img }}
      -
        name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/public
          file: ${{ github.workspace }}/public/${{ inputs.img }}.dockerfile
          build-args: |
            BPROTAG=${{ steps.tags.outputs.tag }}
          platforms: ${{ inputs.platforms }}
          provenance: false
          labels: ${{ steps.metadata.outputs.labels }}
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.tagged }}
          push: true
      -
        name: Attest Docker image
        uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.img }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
      -
        name: Report after build
        run: |
          docker pull ${{ steps.tags.outputs.latest }}
          docker images
      -
        name: Create Software Bill of Materials (SBOM) using syft
        id: sbom
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ steps.tags.outputs.latest }}
          format: spdx-json
          output-file: ${{ github.event.repository.name }}-${{ inputs.img }}-${{ steps.tags.outputs.tag }}.spdx.json
          artifact-name: ${{ github.event.repository.name }}-${{ inputs.img }}-${{ steps.tags.outputs.tag }}.spdx.json
          upload-artifact: true
      -
        name: Vulnerability scan from SBOM with grype
        id: scan
        uses: anchore/scan-action@v6
        if: ${{ steps.sbom.outcome == 'success' }}
        continue-on-error: true
        with:
          sbom: ${{ github.event.repository.name }}-${{ inputs.img }}-${{ steps.tags.outputs.tag }}.spdx.json
          fail-build: false # fail the build if vulnerabilities are found
          severity-cutoff: high # optional; default is medium
      -
        name: Upload grype SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ steps.scan.outcome == 'success' }}
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      -
        name: SARIF report
        if: ${{ steps.scan.outcome == 'success' }}
        continue-on-error: true
        run: |
          cat ${{ steps.scan.outputs.sarif }}
      -
        name: Determine multi-platform package SHAs
        id: multi-arch
        if: ${{ steps.push.outcome == 'success' }}
        run: |
          # Remove docker image pulled during "Report after build"
          docker rmi ${{ steps.tags.outputs.latest }}
          # Initialize an empty array to store all digests
          declare -a digests_array=()
          # Get all tags
          tags=$(skopeo list-tags docker://${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.img }} | jq -r '.Tags[]' | paste -s -d ' ' -)
          echo "Found tags: ${tags}"
          # Convert space-separated string to array for iteration
          IFS=' ' read -r -a tag_array <<< "$tags"
          # Loop through each tag and inspect its manifest
          for tag in "${tag_array[@]}"; do
            echo "Inspecting manifest for tag: $tag"
            if digests_tag=$(docker manifest inspect ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.img }}:$tag 2>/dev/null | jq -r '.manifests[].digest' | paste -s -d ' ' -); then
              echo "Digests for $tag: $digests_tag"
              # Append to the digests array
              digests_array+=("$digests_tag")
            else
              echo "Warning: Could not get digests for tag $tag"
            fi
          done
          # Output all collected digests
          echo "All digests: ${digests_array[*]}"
          echo "digests=${digests_array[*]}" >> $GITHUB_OUTPUT
      -
        name: Delete untagged images from ghcr
        uses: snok/container-retention-policy@v3.0.0
        if: ${{ steps.push.outcome == 'success' && steps.multi-arch.outcome == 'success' }}
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ github.event.repository.name }}/${{ inputs.img }}
          tag-selection: untagged
          skip-shas: ${{ steps.multi-arch.outputs.digests }}
          cut-off: 1m
          dry-run: false
