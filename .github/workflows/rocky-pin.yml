name: rocky-pin

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-pin.dockerfile'
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'public/rocky-pin.dockerfile'
  workflow_dispatch:
  workflow_run:
    workflows: ["rocky-pro"]
    types:
      - completed

jobs:
  rocky-pin:
    uses: externpro/actpro/.github/workflows/buildpro.yml@main
    with:
      img: rocky-pin
