name: rocky-pin
on:
  push:
    branches: ["xpro"]
    paths:
      - 'public/rocky-pin.dockerfile'
  pull_request:
    branches: ["xpro"]
    paths:
      - 'public/rocky-pin.dockerfile'
  workflow_dispatch:
  workflow_run:
    workflows: ["rocky8-gcc9"]
    types:
      - completed
jobs:
  rocky-pin:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'workflow_dispatch')
    uses: ./.github/workflows/buildpro.yml
    with:
      img: rocky-pin
